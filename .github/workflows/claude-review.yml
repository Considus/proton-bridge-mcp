name: Claude review

# Reviews each PR once when it opens, reopens or leaves draft, on the Claude
# subscription (CLAUDE_CODE_OAUTH_TOKEN). Later pushes are not re-reviewed, to
# keep plan usage down; close and reopen the PR to get a fresh review.
#
# The job FAILS if the review posts nothing. A run can end `success` having
# reviewed nothing (2026-10-01, Considus-Ops #123: two turns, 8 refused tool
# calls, no comment), and a green check that means only "the job finished"
# reads as "reviewed" to anyone merging. Refused tool calls are listed in the log.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts, fork PRs (no secrets there) and bot PRs such as Dependabot.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - id: review
        uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790 # v1.0.235
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read CLAUDE.md and AGENTS.md in the repo
            first if they exist, and hold the change to the rules they state.

            Report only what is worth acting on:
            - correctness bugs, regressions and unhandled edge cases
            - security problems and data loss or corruption risks
            - changes that contradict the repo's documented rules
            - a mismatch between the PR description and the diff: behaviour
              the diff adds that the description does not mention, or a
              claim the description makes that the diff does not do (quote
              the description line)
            Do not comment on style, naming or formatting unless it causes a bug.
            Skip generated output, built HTML/CSS, images, fonts and lockfiles.

            Verify each finding against the code before posting it. Post each
            finding as an inline comment on the line it concerns, then one short
            top-level comment summarising the review. If there is nothing worth
            raising, post a single comment saying so.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

      - name: List tool calls the review was refused
        if: always() && steps.review.outputs.execution_file != ''
        env:
          EXEC: ${{ steps.review.outputs.execution_file }}
        run: |
          jq -r '[.[] | select(.type == "result")] | last
                 | if . == null then "no result message in the execution file"
                   elif (.permission_denials // []) == [] then "no tool calls were refused"
                   else .permission_denials[] | "refused: \(.tool_name) \(.tool_input | tostring | .[0:200])" end' "$EXEC" \
            || echo "::warning::Could not read the execution file, so refused tool calls are not listed."

      - name: Fail if the review posted nothing
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          RAN: ${{ steps.review.outputs.execution_file != '' }}
        run: |
          if [ "$RAN" != "true" ]; then
            echo "::error::The review did not run (see the review step's warning). claude-code-action never reviews a PR that edits this workflow file, so review such a PR locally."
            exit 1
          fi
          # GitHub's clock, not the runner's: the comments carry GitHub timestamps.
          since=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .run_started_at) \
            || { echo "::error::Could not read this run's start time."; exit 1; }
          # The Claude App posts as claude[bot]; without the app installed the
          # action falls back to the workflow token, which posts as github-actions[bot].
          who='(.user.login == "claude[bot]" or .user.login == "github-actions[bot]")'
          n=0
          for spec in "issues/$PR/comments created_at" "pulls/$PR/comments created_at" "pulls/$PR/reviews submitted_at"; do
            set -- $spec
            counts=$(gh api --paginate "repos/$REPO/$1" --jq "[.[] | select($who and .$2 >= \"$since\")] | length") \
              || { echo "::error::Could not read $1, so cannot tell whether the review posted."; exit 1; }
            for c in $counts; do n=$((n + c)); done
          done
          echo "review comments posted since $since: $n"
          if [ "$n" -eq 0 ]; then
            echo "::error::The review finished without posting anything, so this PR has not been reviewed. Re-run this job."
            exit 1
          fi
